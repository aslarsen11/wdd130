<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacting the Splash White Water Rafting company.">
    <meta name="author" content="Anna Larsen">
    <title>Contact us, Splash White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="Splash White Water Rafting company logo">
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1 class="contacth1">Splash White Water Rafting Company</h1>
        <div class="grid">
            <div class="info">
                <p>7023 Highway 55<br>Horseshoe Bend, Idaho<br>+1 999 999 9999<br>contact@splashwhitewater.com</p>
            </div>
            <span class="map">
                <iframe src=" https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d368651.3314745316!2d-116.26114791582276!3d43.79177604440417!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1795559928394!5m2!1sen!2sus" width="325" height="325" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </span>
            <form>
                <div class="name">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="&nbsp;John Smith" required>
                </div>
                <div class="email">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="&nbsp;johnsmith@gmail.com" required>
                </div>
                <div class="purpose">
                    <p>Message<br>Purpose</p>
                    <div class="purposeoptions">
                        <div>
                            <input type="radio" name="contact" id="inquiry" value="" checked>
                            <label for="inquiry">&nbsp;General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" name="contact" id="reservation" value="">
                            <label for="reservation">&nbsp;Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" name="contact" id="website" value="">
                            <label for="website">&nbsp;Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <span class="textbox">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4" placeholder="&nbsp;Type here"></textarea>
                </span>
                <span class="newsletter">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">&nbsp;&nbsp;Please Subscribe me to the monthly newsletter</label>
                </span>
                <br>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <div class="box">
            <p>We Are Here to Serve You</p>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="Customer service representative Alan">
                    <figcaption>Alan<br>Office Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Customer service representative Beth">
                    <figcaption>Beth<br>Trip Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Customer service representative Calvin">
                    <figcaption>Calvin<br>Office Administrator</figcaption>
                </figure>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 | Splash White Water Rafting | Anna Larsen</p>
        <nav class="socialmedia">
            <a href="https://www.youtube.com/" target="_blank" rel="noopener">
                <img src="images/youtube.jpg" alt="Youtube">
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>
        </nav>
    </footer>

</body>

</html>
